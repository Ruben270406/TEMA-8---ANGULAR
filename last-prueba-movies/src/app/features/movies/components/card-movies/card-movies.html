<div class="card" style="width:18rem">
    
        <img [src]="movies().image" alt="">
    
    <div>
        <p><strong>Movie:</strong>{{movies().title}}</p>
        <p><strong>Premiere:</strong>{{movies().year}}</p>
        <p><strong>Stars:</strong>{{movies().stars}}</p>
    </div>
    <div>
        <button class="btn btn-danger">Delete Movie</button>
        <button class="btn btn-primary">Select Movie</button>
    </div>

</div>
